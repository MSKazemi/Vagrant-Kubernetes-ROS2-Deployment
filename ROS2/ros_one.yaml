# LEGACY FOXy EXAMPLE (ROS 2 Foxy is end-of-life).
# Uses the historical Foxy stress-ng image and older Kubernetes lab.
# NOT a ROS 2 Jazzy deployment or a verified cross-node DDS demonstration.
# For the independent Jazzy container image, see ROS2/jazzy/README.md.
apiVersion: v1
kind: Namespace
metadata:
  name: ros
---
apiVersion: apps/v1
kind: Deployment
metadata:
  creationTimestamp: null
  labels:
    app: ros
  name: ros
  namespace: ros
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ros
  strategy: 
    type: Recreate
  template:
    metadata:
      creationTimestamp: null
      labels:
        app: ros
    spec:
      terminationGracePeriodSeconds: 1
      containers:
        - image: docker.io/kazemi/ros-foxy-with-stress-ng
          name: ros
          command:
            - /bin/bash
            - '-c'
          args:
              - >
                echo "Pod will crash after 30 seconds"; sleep 30; exit 1
status: {}
